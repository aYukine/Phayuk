# Example nginx site for the static build.
# 1. ./start.sh build   (outputs frontend/dist)
# 2. copy/rsync frontend/dist to /var/www/phayuk  (or point root at it)
# 3. sudo ln -s /path/to/deploy/nginx.conf /etc/nginx/sites-enabled/phayuk && sudo nginx -t && sudo systemctl reload nginx
# The admin dashboard is NOT deployed; it only runs locally.

server {
    listen 80;
    listen [::]:80;
    server_name phayuk.com www.phayuk.com;

    root /var/www/phayuk;
    index index.html;

    # Redirect old query-string URLs (?id=...) to the new clean URLs.
    location = /projects/index.html { if ($arg_id) { return 301 /projects/$arg_id/; } try_files $uri =404; }
    location = /awards/index.html   { if ($arg_id) { return 301 /awards/$arg_id/; } try_files $uri =404; }
    location = /sitemap.xml { return 301 /sitemap-index.xml; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed build assets never change.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|pdf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
