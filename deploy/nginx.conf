# nginx site for the portfolio. deploy/install.sh fills in __DOMAIN__ and __ROOT__
# and installs it as /etc/nginx/sites-available/<site name>.
# It only answers for __DOMAIN__, so other sites on the same nginx are untouched.
# HTTPS is added afterwards by certbot (install.sh --ssl), which edits the installed copy.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __ROOT__/current;
    index index.html;

    # Old query-string URLs (?id=...) → new clean URLs.
    location = /projects/index.html { if ($arg_id) { return 301 /projects/$arg_id/; } try_files $uri =404; }
    location = /awards/index.html   { if ($arg_id) { return 301 /awards/$arg_id/; } try_files $uri =404; }
    location = /sitemap.xml { return 301 /sitemap-index.xml; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed build assets never change.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|pdf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
